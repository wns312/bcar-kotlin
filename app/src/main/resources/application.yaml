spring:
  application:
    name: bcar
  main:
    web-application-type: none

automation:
  playwright:
    browser: chromium
    headless: true
    slow-mo-ms: 0
    timeout-ms: 30000

dynamodb:
  cars-table: bcar-dev-cars

batch:
  detail-shards: 8
  detail-max-hops: 300
  jobs:
    assign-cars:
      queue: bcar-dev-queue
      definition: bcar-dev-job
    collect-detail:
      queue: bcar-dev-detail-queue
      definition: bcar-dev-detail-job
    sync-upload:
      queue: bcar-dev-sync-and-upload-queue
      definition: bcar-dev-sync-upload-job

upload:
  comment-file: classpath:upload-comment.txt
  max-attempts: 3
  # 가격이 max-price 이하인 첫 구간의 마진을 얹어 올린다
  margins:
    - max-price: 2000
      domestic: 40
      imported: 60
    - max-price: 5000
      domestic: 60
      imported: 60
    - max-price: 10000
      domestic: 60
      imported: 60

assign:
  ratio:
    domestic-under-1300: 0.3
    domestic-over-1300: 0.45
    imported: 0.1
    cargo: 0.1
    truck: 0.05
  fallback-order: [domestic-under-1300, domestic-over-1300, imported, cargo, truck]
