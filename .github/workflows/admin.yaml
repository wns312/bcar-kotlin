name: Admin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bcar-prod-manual-exclusion
  cancel-in-progress: false

jobs:
  trigger-exclusion:
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Verify existing assignment and synchronization (read only)
        run: uv run --with boto3 python tools/trigger_exclusion.py
