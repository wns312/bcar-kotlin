spring:
  application:
    name: bcar
  main:
    web-application-type: none

automation:
  playwright:
    browser: chromium
    headless: true
    slow-mo-ms: 0
    timeout-ms: 30000

dynamodb:
  cars-table: bcar-dev-cars

batch:
  detail-shards: 8
  detail-max-hops: 300
  jobs:
    collect-detail:
      queue: bcar-dev-detail-queue
      definition: bcar-dev-detail-job
